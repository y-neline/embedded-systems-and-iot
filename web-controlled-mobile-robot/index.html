<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Control</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 120px 120px 120px;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
    }

    button {
      font-size: 18px;
      padding: 18px;
      border: none;
      border-radius: 12px;
      background: #2d89ef;
      color: white;
      cursor: pointer;
    }

    button.stop {
      background: #d9534f;
    }

    #status {
      margin-top: 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Robot Control</h1>

  <h2>Live Camera</h2>
  <img src="/video_feed" width="480" style="border-radius:12px; max-width:100%;">

  <div class="grid">
    <div></div>
    <button onclick="sendCommand('/forward')">Forward</button>
    <div></div>

    <button onclick="sendCommand('/left')">Left</button>
    <button class="stop" onclick="sendCommand('/stop')">Stop</button>
    <button onclick="sendCommand('/right')">Right</button>

    <div></div>
    <button onclick="sendCommand('/reverse')">Reverse</button>
    <div></div>
  </div>

  <p id="status">Ready</p>

  <script>
    async function sendCommand(path) {
      try {
        const response = await fetch(path);
        const text = await response.text();
        document.getElementById("status").textContent = text;
      } catch (e) {
        document.getElementById("status").textContent = "Request failed";
      }
    }
  </script>
</body>
</html>
